[theme]
base = "light"
primaryColor = "#6C5CE7"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F3FF"
textColor = "#1F1B2E"
font = "sans serif"

[client]
# "viewer" hides Streamlit's Deploy/GitHub branding but keeps the ⋮ menu
# (including the light/dark theme toggle) reachable — "minimal" would hide
# that too, taking away the one built-in way users can switch themes.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
