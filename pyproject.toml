[project]
name = "echopad"
version = "0.3.0"
description = "The private, local-first AI voice notebook for students and young professionals."
readme = "README.md"
# The floor CI actually exercises — see .github/workflows/ci.yml.
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "streamlit>=1.38",
    "faster-whisper>=1.0",
    "ollama>=0.3",
    "markdown>=3.6",
    "fpdf2>=2.7",
    "python-dotenv>=1.0",
    # Importing notes from other formats (image OCR also needs the Tesseract engine)
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    # Reading LMS calendar (ICS) feeds for assignment deadlines
    "icalendar>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so the tests can `import db` / `import engine`.
# Without this, a bare `pytest` (as CI runs) only adds tests/ to sys.path and
# collection fails with ModuleNotFoundError — `python -m pytest` happened to
# work locally because it also adds the current directory.
pythonpath = ["."]
