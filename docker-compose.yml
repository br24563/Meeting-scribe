services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot container that pulls the default model, then exits.
  # Safe to re-run: `ollama pull` is a no-op if the model is already present.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2"]
    restart: "no"

  echopad:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Your notes land in ./notes on the host, so they outlive the container.
      - ./notes:/app/notes
      # Preferences and the search index would otherwise live in the
      # container's throwaway home directory and reset on every restart.
      - echopad_config:/root/.echopad
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # Pinning the notes path keeps the Settings tab from offering to move
      # them somewhere outside the mount above, which wouldn't survive
      # `docker compose down`. Settings shows it as environment-controlled.
      - ECHOPAD_STORAGE_DIR=/app/notes
      - ECHOPAD_CONFIG_DIR=/root/.echopad
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama_data:
  echopad_config:
